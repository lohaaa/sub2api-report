name: Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Internal candidate version
        required: true
        default: 0.8.0-internal.2
        type: string
      previous_version:
        description: Published release used for update and rollback tests
        required: true
        default: 1.1.1
        type: string
      release_notes_section:
        description: Changelog section used for candidate release notes
        required: true
        default: Unreleased
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
      CANDIDATE_RELEASE_NOTES_SECTION: ${{ inputs.release_notes_section }}
      STALE_HOST_METADATA_VERSION: 1.0.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate candidate version
        shell: bash
        run: |
          candidate_pattern='^[0-9]+\.[0-9]+\.[0-9]+-internal([.][0-9]+)?$'
          release_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $CANDIDATE_VERSION =~ $candidate_pattern ]]
          [[ $PREVIOUS_VERSION =~ $release_pattern ]]
          candidate_base=${CANDIDATE_VERSION%%-*}
          [[ $(printf '%s\n%s\n' "$PREVIOUS_VERSION" "$candidate_base" | sort -V | tail -n 1) == "$candidate_base" ]]
          [[ $PREVIOUS_VERSION != "$candidate_base" ]]
          [[ $(jq -r '.releaseVersion' deploy/release-compatibility.json) == "$candidate_base" ]]
          if [[ $(jq -r '.onlineInstallSupported' deploy/release-compatibility.json) == true ]]; then
            jq -e --arg previous "$PREVIOUS_VERSION" \
              '.onlineUpgradeFrom == [$previous]' deploy/release-compatibility.json >/dev/null
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # Node.js 24 LTS
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: dotnet restore Sub2ApiReport.slnx
      - run: pnpm quality
      - run: |
          bash -n deploy/*.sh
          shellcheck -x deploy/*.sh
          deploy/documentation-test.sh
          deploy/docker-bootstrap-test.sh
          deploy/release-lib-test.sh
          deploy/server-bootstrap-test.sh
          deploy/server-install-test.sh

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Download previous published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate-previous/stale-host-metadata
          bundle="sub2api-report-v${PREVIOUS_VERSION}-linux-amd64.tar.gz"
          gh release download "v$PREVIOUS_VERSION" --dir candidate-previous \
            --pattern "$bundle" --pattern checksums.txt
          grep -F "  $bundle" candidate-previous/checksums.txt \
            > candidate-previous/bundle-checksum.txt
          (cd candidate-previous && sha256sum --check --strict bundle-checksum.txt)
          gh release download "v$STALE_HOST_METADATA_VERSION" \
            --dir candidate-previous/stale-host-metadata \
            --pattern release-manifest.json \
            --pattern release-manifest.sig \
            --pattern update-public-key.pem

      - name: Build signed candidate assets
        shell: bash
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
        run: |
          test -n "$RELEASE_SIGNING_KEY_PEM"
          key_file=$(mktemp "$RUNNER_TEMP/release-key.XXXXXX.pem")
          trap 'rm -f "$key_file"' EXIT
          chmod 0600 "$key_file"
          printf '%s\n' "$RELEASE_SIGNING_KEY_PEM" > "$key_file"
          RELEASE_SIGNING_KEY_FILE=$key_file \
          RELEASE_NOTES_SECTION="$CANDIDATE_RELEASE_NOTES_SECTION" \
            deploy/build-release-assets.sh "$CANDIDATE_VERSION" candidate

      - name: Verify previous release trust and bundle
        shell: bash
        run: |
          previous_verify=$(mktemp -d "$RUNNER_TEMP/previous-verify.XXXXXX")
          trap 'rm -rf "$previous_verify"' EXIT
          tar -xzf "candidate-previous/sub2api-report-v${PREVIOUS_VERSION}-linux-amd64.tar.gz" \
            -C "$previous_verify"
          cmp "$previous_verify/update-public-key.pem" candidate/update-public-key.pem
          cmp candidate-previous/stale-host-metadata/update-public-key.pem \
            candidate/update-public-key.pem
          openssl dgst -sha256 -verify candidate/update-public-key.pem \
            -signature candidate-previous/stale-host-metadata/release-manifest.sig \
            candidate-previous/stale-host-metadata/release-manifest.json
          source "$previous_verify/release-lib.sh"
          verify_release_bundle "$previous_verify"

      - name: Generate App SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sub2api-report-app:${{ inputs.version }}
          format: spdx-json
          output-file: candidate/sub2api-report-app-${{ inputs.version }}.spdx.json

      - name: Generate Updater SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sub2api-report-updater:${{ inputs.version }}
          format: spdx-json
          output-file: candidate/sub2api-report-updater-${{ inputs.version }}.spdx.json

      - name: Scan App image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sub2api-report-app:${{ inputs.version }}
          format: table
          exit-code: 1
          ignore-unfixed: false
          severity: CRITICAL

      - name: Scan Updater image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sub2api-report-updater:${{ inputs.version }}
          format: table
          exit-code: 1
          ignore-unfixed: false
          severity: CRITICAL

      - name: Verify generated bundle
        shell: bash
        run: |
          verify_dir=$(mktemp -d "$RUNNER_TEMP/candidate-verify.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf "candidate/sub2api-report-v${CANDIDATE_VERSION}-linux-amd64.tar.gz" -C "$verify_dir"
          source "$verify_dir/release-lib.sh"
          verify_release_bundle "$verify_dir"

      - name: Smoke test direct server package
        shell: bash
        run: |
          server_root=$(mktemp -d "$RUNNER_TEMP/server-smoke.XXXXXX")
          data_root="$server_root/data"
          mkdir -p "$server_root/bundle" "$data_root/db" "$data_root/keys"
          tar -xzf "candidate/sub2api-report-server-v${CANDIDATE_VERSION}-linux-amd64.tar.gz" -C "$server_root/bundle"
          connection="Data Source=$data_root/db/sub2api-report.db;Foreign Keys=True;Default Timeout=5;Pooling=True"
          env ConnectionStrings__Database="$connection" DataProtection__KeysPath="$data_root/keys" \
            "$server_root/bundle/runtime/Sub2ApiReport.Migrator"
          env ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:18081 \
            ConnectionStrings__Database="$connection" DataProtection__KeysPath="$data_root/keys" \
            "$server_root/bundle/runtime/Sub2ApiReport.Api" >"$server_root/app.log" 2>&1 &
          app_pid=$!
          cleanup_server() {
            kill "$app_pid" >/dev/null 2>&1 || true
            wait "$app_pid" >/dev/null 2>&1 || true
            rm -rf "$server_root"
          }
          trap cleanup_server EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18081/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ $ready != true ]]; then
            cat "$server_root/app.log" >&2
            exit 1
          fi

      - name: Test install, rollback, and update
        shell: bash
        run: |
          smoke_root=$(mktemp -d "$RUNNER_TEMP/candidate-smoke.XXXXXX")
          previous_dir="$smoke_root/previous"
          target_dir="$smoke_root/target"
          failure_dir="$smoke_root/failure"
          install_dir="$smoke_root/install"
          mkdir -p "$previous_dir" "$target_dir"
          tar -xzf "candidate-previous/sub2api-report-v${PREVIOUS_VERSION}-linux-amd64.tar.gz" -C "$previous_dir"
          tar -xzf "candidate/sub2api-report-v${CANDIDATE_VERSION}-linux-amd64.tar.gz" -C "$target_dir"
          sed -i 's/^APP_PORT=.*/APP_PORT=18080/; s/^BIND_ADDRESS=.*/BIND_ADDRESS=127.0.0.1/' "$previous_dir/.env.example"
          cleanup() {
            sudo docker compose --project-directory "$install_dir" -f "$install_dir/compose.yaml" down --volumes >/dev/null 2>&1 || true
            sudo rm -rf "$smoke_root"
          }
          trap cleanup EXIT

          sudo env \
            SUB2API_REPORT_INSTALL_DIR="$install_dir" \
            SUB2API_REPORT_START=false \
            "$previous_dir/install.sh"
          test -z "$(sudo docker compose --project-directory "$install_dir" -f "$install_dir/compose.yaml" ps -q)"
          sudo docker compose --project-directory "$install_dir" -f "$install_dir/compose.yaml" up -d --no-build
          sudo bash -c \
            'source "$1"; wait_for_service_health "$2" app 120; wait_for_service_health "$2" updater 60' \
            _ "$previous_dir/release-lib.sh" "$install_dir"
          curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null
          [[ $(sudo jq -r '.version' "$install_dir/release-manifest.json") == "$PREVIOUS_VERSION" ]]
          sudo docker compose --project-directory "$install_dir" -f "$install_dir/compose.yaml" \
            exec -T updater sh -c 'test -r /var/run/docker.sock && test -w /var/run/docker.sock'
          updater_status=$(sudo docker compose --project-directory "$install_dir" -f "$install_dir/compose.yaml" \
            exec -T updater sh -c 'token=$(cat /run/secrets/updater-token); curl --fail --silent -H "Authorization: Bearer $token" http://127.0.0.1:8081/internal/v1/status')
          [[ $(jq -r '.installationEnabled' <<<"$updater_status") == true ]]
          sudo install -m 0644 candidate-previous/stale-host-metadata/release-manifest.json \
            candidate-previous/stale-host-metadata/release-manifest.sig \
            candidate-previous/stale-host-metadata/update-public-key.pem \
            "$install_dir/"
          [[ $(sudo jq -r '.version' "$install_dir/release-manifest.json") == "$STALE_HOST_METADATA_VERSION" ]]

          previous_app_container=$(sudo docker compose --project-directory "$install_dir" \
            -f "$install_dir/compose.yaml" ps -q app)
          previous_app_image=$(sudo docker inspect --format '{{.Image}}' "$previous_app_container")
          sudo docker tag "sub2api-report-app:$CANDIDATE_VERSION" sub2api-report-app:current
          [[ $(sudo docker image inspect sub2api-report-app:current --format '{{.Id}}') != "$previous_app_image" ]]

          cp -a "$target_dir" "$failure_dir"
          sed -i \
            -e 's#health/live#health/never#' \
            -e 's/interval: 15s/interval: 1s/g' \
            -e 's/retries: 4/retries: 1/g' \
            -e 's/start_period: [0-9][0-9]*s/start_period: 0s/g' \
            "$failure_dir/compose.yaml"
          if sudo env \
            SUB2API_REPORT_INSTALL_DIR="$install_dir" \
            SUB2API_REPORT_APP_HEALTH_TIMEOUT=20 \
            SUB2API_REPORT_UPDATER_HEALTH_TIMEOUT=20 \
            "$failure_dir/update.sh"; then
            echo "The injected readiness failure unexpectedly succeeded." >&2
            exit 1
          fi
          [[ $(sudo jq -r '.version' "$install_dir/release-manifest.json") == "$STALE_HOST_METADATA_VERSION" ]]
          [[ $(sudo docker image inspect sub2api-report-app:current --format '{{.Id}}') == "$previous_app_image" ]]
          curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null

          sudo env SUB2API_REPORT_INSTALL_DIR="$install_dir" "$target_dir/update.sh"
          [[ $(sudo jq -r '.version' "$install_dir/release-manifest.json") == "$CANDIDATE_VERSION" ]]
          curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null
          backup_count=$(sudo find "$install_dir/data-backups" -mindepth 1 -maxdepth 1 -type d | wc -l)
          sudo env SUB2API_REPORT_INSTALL_DIR="$install_dir" "$target_dir/update.sh"
          [[ $(sudo find "$install_dir/data-backups" -mindepth 1 -maxdepth 1 -type d | wc -l) == "$backup_count" ]]
          curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sub2api-report-${{ inputs.version }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
