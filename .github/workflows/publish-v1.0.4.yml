name: Publish v1.0.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish validated draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit v1.0.4 --draft=false --latest --repo "$GH_REPO"
