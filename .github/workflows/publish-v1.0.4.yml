name: Publish v1.0.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish validated draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases/tags/v1.0.4" --jq .id)
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            --field draft=false \
            --raw-field make_latest=true >/dev/null
