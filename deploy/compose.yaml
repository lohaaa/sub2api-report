name: sub2api-report

services:
  app:
    image: sub2api-report-app:dev
    build:
      context: ..
      dockerfile: Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Data Source=/data/db/sub2api-report.db;Foreign Keys=True;Default Timeout=5;Pooling=True
      DataProtection__KeysPath: /data/keys
      Updater__BaseUrl: http://updater:8081
      Updater__TokenFile: /run/secrets/updater-token
    volumes:
      - app-data:/data
      - ./secrets/updater-token:/run/secrets/updater-token:ro
    networks:
      - frontend
      - control
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      io.sub2api-report.role: app
      io.sub2api-report.contract: "1"

  updater:
    image: sub2api-report-updater:dev
    build:
      context: ..
      dockerfile: Dockerfile.updater
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Updater__StatePath: /update-state
      Updater__TokenFile: /run/secrets/updater-token
      Updater__InstallationEnabled: "false"
    volumes:
      - updater-state:/update-state
      - ./secrets/updater-token:/run/secrets/updater-token:ro
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health/live"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      io.sub2api-report.role: updater
      io.sub2api-report.contract: "1"

networks:
  frontend:
  control:
    internal: true

volumes:
  app-data:
  updater-state:
