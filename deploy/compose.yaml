name: sub2api-report

services:
  app:
    image: sub2api-report-app:current
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__SecureCookies: ${SECURE_COOKIES:-false}
      ConnectionStrings__Database: Data Source=/data/db/sub2api-report.db;Foreign Keys=True;Default Timeout=5;Pooling=True
      DataProtection__KeysPath: /data/keys
    volumes:
      - app-data:/data
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/health/live",
        ]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      io.sub2api-report.role: app
      io.sub2api-report.contract: "2"

networks:
  frontend:

volumes:
  app-data:
